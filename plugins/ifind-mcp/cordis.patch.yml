# ifind-mcp bundle patch: mounts the official 同花顺 iFinD MCP server as dsh
# tools (mcp__ifind__*). Credentials come from the environment — the terminal
# backend loads plugins/ifind-mcp/.env (gitignored) into the dsh subprocess.
# Get the URL + key from the iFinD 终端: 工具 > 常用工具 > 数据 MCP.
# Without env the plugin activates but registers no tools (failOnStartupError
# stays false), so the patch is safe to keep mounted pre-configuration.

- insert:
    - id: alpha-desk-ifind-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ifind
        transport: streamable-http
        url: !!js 'process.env.IFIND_MCP_URL || ""'
        headers:
          Authorization: !!js 'process.env.IFIND_MCP_KEY ? `Bearer ${process.env.IFIND_MCP_KEY}` : ""'
        toolCallTimeoutMs: 30000
