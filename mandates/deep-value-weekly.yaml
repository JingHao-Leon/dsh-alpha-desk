# Deep-Value Weekly — 格雷厄姆领衔的深度价值基金
# Graham leads (double blend weight); Buffett and Munger keep quality in
# the mix. Long-biased, weekly rebalance, unlevered.
#
#   aihf mandates/deep-value-weekly.yaml --tickers AAPL,MSFT,NVDA
#   aihf mandates/deep-value-weekly.yaml --tickers AAPL,MSFT,NVDA --backtest
#
name: deep-value-weekly
strategies:
  - name: deep-value          # discretionary pod: Graham-led, long-biased
    weight: 0.7               # capital slice, relative to sibling strategies
    models:
      - name: graham
        weight: 2.0
      - name: buffett
      - name: munger
  - name: earnings-drift      # systematic pod: post-earnings drift (quant)
    weight: 0.3
    models:
      - name: pead
risk:
  max_position_pct: 0.25      # no single name above 25% of equity
  max_gross_exposure: 1.0     # unlevered, across the netted book
capital: 100000
rebalance: weekly             # daily | weekly | monthly
benchmark: SPY
